<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ฝึกเขียนฮิรางานะ | Hiragana Writing Practice</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>ひらがな <span>ฝึกเขียนฮิรางานะ</span></h1>
      <button id="settingsBtn" class="icon-btn" title="ตั้งค่า" aria-label="ตั้งค่า">⚙️</button>
    </header>

    <section class="stats-bar" id="statsBar">
      <div class="stat"><span class="stat-value" id="statAttempts">0</span><span class="stat-label">ครั้ง</span></div>
      <div class="stat"><span class="stat-value" id="statAccuracy">0%</span><span class="stat-label">ความแม่นยำ</span></div>
      <div class="stat"><span class="stat-value" id="statStreak">0</span><span class="stat-label">ถูกติดต่อกัน</span></div>
    </section>

    <main class="practice-area">
      <div class="prompt-card">
        <div class="prompt-label">เขียนตัวอักษรที่อ่านว่า</div>
        <div class="prompt-romaji" id="promptRomaji">a</div>
        <button id="speakBtn" class="icon-btn small" title="ฟังเสียง" aria-label="ฟังเสียง">🔊</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="guideCanvas" width="320" height="320" aria-hidden="true"></canvas>
        <canvas id="drawCanvas" width="320" height="320"></canvas>
        <canvas id="overlayCanvas" width="320" height="320" aria-hidden="true"></canvas>
      </div>

      <div class="toolbar">
        <button id="undoBtn" class="btn">↩️ ย้อนกลับ</button>
        <button id="clearBtn" class="btn">🗑️ ล้าง</button>
        <button id="checkBtn" class="btn primary">✔️ ตรวจคำตอบ</button>
        <button id="nextBtn" class="btn" disabled>ถัดไป ➡️</button>
      </div>

      <div class="result-panel" id="resultPanel" hidden>
        <div class="result-headline" id="resultHeadline"></div>
        <div class="result-score" id="resultScore"></div>
        <div class="result-answer" id="resultAnswer"></div>
      </div>
    </main>
  </div>

  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-panel">
      <div class="settings-header">
        <h2>ตั้งค่า</h2>
        <button id="closeSettingsBtn" class="icon-btn" aria-label="ปิด">✖️</button>
      </div>

      <div class="settings-group">
        <h3>กลุ่มตัวอักษร</h3>
        <label class="checkbox-row"><input type="checkbox" data-group="basic" checked /> พื้นฐาน (あ〜ん) 46 ตัว</label>
        <label class="checkbox-row"><input type="checkbox" data-group="dakuten" /> เสียงกล้ำ (が ざ だ ば) 20 ตัว</label>
        <label class="checkbox-row"><input type="checkbox" data-group="handakuten" /> เสียงครึ่งกล้ำ (ぱ) 5 ตัว</label>
        <label class="checkbox-row"><input type="checkbox" data-group="youon" /> เสียงควบ (きゃ しゃ) 33 ตัว</label>
      </div>

      <div class="settings-group">
        <h3>ปากกา</h3>
        <label class="range-row">ขนาดเส้น
          <input type="range" id="penSize" min="4" max="20" value="10" />
        </label>
        <label class="checkbox-row"><input type="checkbox" id="showGuide" checked /> แสดงเส้นไกด์</label>
      </div>

      <div class="settings-group">
        <h3>ความคืบหน้า</h3>
        <p id="progressSummary" class="muted"></p>
        <button id="resetStatsBtn" class="btn danger">ล้างสถิติทั้งหมด</button>
      </div>
    </div>
  </div>

  <script src="kana-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
